<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кислота - {{ .acid.Name }}</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body>
<header>
    <button type="button" class="button home" onclick="location.href='/acid_select'">⌂  Домой</button>
</header>
<div class="card detail-card">
    <h2>{{ .acid.Name }} - {{ .acid.NameExt }}</h2>
    <img src="{{ .acid.ImgURL }}" alt="{{ .acid.Name }}">
    <p>{{ .acid.Desc }}</p>
    <div class="h-plus">Количество ионов H⁺: {{ .acid.Hplus }}</div>
</div>
</body>
</html>
